[package]
name = "oxidegen"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust port of XcodeGen's project.yml spec loader and project generator"

[lib]
name = "oxidegen"
path = "src/lib.rs"

[[bin]]
name = "oxidegen"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
indexmap = { version = "2.2", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
