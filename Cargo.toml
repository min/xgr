[package]
name = "xcodegenrust"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Rust port of XcodeGen's project.yml spec loader and project generator"
repository = "https://github.com/min/xcodegen-rs"
readme = "README.md"
keywords = ["xcode", "xcodegen", "ios", "macos", "project-generator"]
categories = ["command-line-utilities", "development-tools"]
exclude = [".github/", ".context/", "upstream-xcodegen/"]

[lib]
name = "xcodegenrust"
path = "src/lib.rs"

[[bin]]
name = "xgr"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
indexmap = { version = "2.2", features = ["serde"] }
md5 = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
serde_yaml = "0.9"
thiserror = "1.0"

[dev-dependencies]
tempfile = "3.10"
