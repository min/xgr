<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">XGR logo</title>
  <desc id="desc">A polished blue macOS-style app icon with a white generation hammer and copper Rust hex-nut accent.</desc>
  <defs>
