      <stop offset="1" stop-color="#aab8c7"/>
    </linearGradient>
    <linearGradient id="blue" x1="132" y1="105" x2="378" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#75dcff"/>
